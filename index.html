<!DOCTYPE html>
<html lang="en">
  <head>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/p5.js/1.11.1/p5.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/p5.js/1.11.1/addons/p5.sound.min.js"></script>
    <link rel="stylesheet" type="text/css" href="style.css">
    <meta charset="utf-8" />
  </head>
  <body>
    <div id="left">
      <div id="ui">
        <label for="textInput">Enter text:</label>
        <input type="text" id="textInput" placeholder="..." />
        
        <div class="slider-container">
          <div class="slider-label">X Value</div>
          <input type="number" id="xPatternValue" value="72" min="1" />
        </div>
        
        <div class="slider-container">
          <div class="slider-label">Y Value</div>
          <input type="number" id="yPatternValue" value="32" min="1" />
        </div>
        <br>
            <br>
            <br>
            <br>
            <br>
            <br>
            <br>
            <br>
            <br>
            <br>
            <br>
            <br>
        <p id="description">The characters of the text you enter are layed out on the page with the following equations:
            <br>
            <br>
            const x = width/2 + cos(i * XV * PI / count) * (width * 0.38); 
            <br>
            const y = height/2 + sin(i * YV * PI / count) * (height * 0.47);
          </p>
      </div>
      
    </div>
    <div id="right">
      <div id="resize-handle"></div>
      <div id="pattern-container"></div>
    </div>
    <script src="sketch.js"></script>
  </body>
</html>
